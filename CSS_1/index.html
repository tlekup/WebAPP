<Doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .card {
            text-align: center;
            background-color: #ffffff;
            border: 1px solid #000000;
            border-radius: 8px;
         
            max-width: 300px;
            margin: 50px auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .title {
            font-size: 24px;
            margin: 10px;
        }
        .contact {
            background-color: #000000;
            font-size: 16px;
            padding: 10px;
            color: #ffffff;
        }
        .card2{
            text-align: center;
            background-color: #ff00f2;
            border: 1px solid #ffffff;
            border-radius: 8px;
            max-width: 300px;
            margin: 50px auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .card2 img {
            width: 100px;
            height: 100px;
            border: 5px solid #ffffff;
            border-radius: 50%;
            margin: 15px;
        }
        .card2title {
            font-size: 24px;
            margin: 10px;
            color: #ffffff;
        }
        .card2contact {
            background-color: #ffffff;
            font-size: 16px;
            padding: 10px;
            margin : 10px;
            border-radius: 5px;
            color: #000000;
        }

    </style>
</head>
<body>
    <div class="card">
        <img src="/1/image/overview.jpg" alt="Overview">
        <h1>John Doe</h1>
        <p class="title">Software Engineer</p>
        <p class="contact">Email: john.doe@example.com</p>
    </div>
    <div class="card2">
        <img src="/1/image/overview.jpg" alt="Overview">
        <h1 style="color: #ffffff;">John Doe</h1>
        <p class="card2title">Software Engineer</p>
        <p class="card2contact">Email: john.doe@example.com</p>
    </div>
</body>
</html>
