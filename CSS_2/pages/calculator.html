    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            *{ 
                margin:0;
                padding:0;
            }
            .container{
                width: 300px;
                height: 500px;
                margin: auto;
                margin-Top : 100px;
            }
            .calculator{
                width: 100%;
                height: 100%;
                background-color: aqua;
                display: flex;
                flex-direction: column;
                align-items: center;
                border-radius: 10px;    
                border : 2px solid #868585;
            }
            .monitor{
                width: 80%;
                height: 15%;
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                justify-content: center;
                background-color: white;
                margin-top: 15px;
                border-radius: 10px;
            }
            .monitor text{
                align-self: end;
                font-size: 40px;
                color: black;

            }
            .cbl{
                width: 70%;
                height: 85%;
                display: flex;
                flex-direction: column;
                flex-wrap: wrap;
            }
            .cbr{
                width: 30%;
                height: 85%;
                display: flex;
                flex-direction: column;
                flex-wrap: wrap;
            }
            .row{
                width: 100%;
                display: flex;
                justify-content: space-between;
                margin: 10px 0px 10px 0px;

            }
            .row button{
                width:  50px;
                height: 50px;
                border-radius: 10px;
                color: rgb(0, 0, 0);
                background-color:#ffffff;
            }
        </style>

    </head>
    <body>
        <div class="container">
            <div class="calculator">
                <div class="monitor">
                    <text>67</text>
                </div>
                <div class="cbl">
                    <div class="row">
                        <button>7</button>
                        <button>8</button>
                        <button>9</button>
                    </div>
                    <div class="row">
                        <button>4</button>
                        <button>5</button>
                        <button>6</button>
                    </div>
                    <div class="row">
                        <button>1</button>
                        <button>2</button>
                        <button>3</button>
                    </div>
                </div>
                <div class="cbr">
                    <div class="row">
                        <button>7</button>
                        <button>8</button>
                        <button>9</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
    </html>
