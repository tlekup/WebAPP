<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator UI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#e6e6e6;
}

.container{
    width:320px;
    margin:60px auto;
}

.calculator{
    background:#4cc9f0;
    border:2px solid #777;
    border-radius:15px;
    padding:20px;
}

.monitor{
    height:80px;
    background:white;
    border-radius:10px;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:15px;
    font-size:40px;
    margin-bottom:20px;
}

.buttons{
    display:flex;
    gap:15px;
}

/* ฝั่งซ้าย */
.left{
    flex:3;
}

.row{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
}

.row button{
    width:60px;
    height:60px;
}

/* ฝั่งขวา */
.right{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.right button{
    width:100%;
    height:60px;
}

/* ปุ่ม */
button{
    border:none;
    border-radius:10px;
    background:white;
    font-size:22px;
    cursor:pointer;
    box-shadow:0 2px 5px rgba(0,0,0,.2);
}

button:hover{
    background:#f2f2f2;
}

.equal{
    flex:1;
    background:#ffb703;
}
</style>

</head>
<body>

<div class="container">

    <div class="calculator">

        <div class="monitor">67</div>

        <div class="buttons">

            <div class="left">

                <div class="row">
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                </div>

                <div class="row">
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                </div>

                <div class="row">
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                </div>

                <div class="row">
                    <button>.</button>
                    <button>0</button>
                    <button>C</button>
                </div>

            </div>

            <div class="right">
                <button>+</button>
                <button>-</button>
                <button>×</button>
                <button>÷</button>
                <button class="equal">=</button>
            </div>

        </div>

    </div>

</div>

</body>
</html>
