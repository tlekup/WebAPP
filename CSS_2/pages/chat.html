<Doctype html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chat</title>
    
    <style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, Helvetica, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#ececec;
    }

    /* กล่องแชท */

    .chat-header{
        background:#0d6efd;
        color:white;
        text-align:center;
        padding:12px;
        border-radius:8px 8px 0 0;
    }

    .chat-header h1{
        font-size:40px;
        font-weight:bold;
        letter-spacing:1px;
    }

    .status{
        margin-top:8px;
        font-size:12px;
        background:white;
        color:#0d6efd;
        display:inline-block;
        padding:3px 10px;
        border-radius:20px;
    }

    /* พื้นที่ข้อความ */

    .chat-body{
        background:#f6f6f6;
        height:360px;
        overflow-y:auto;
        padding:12px;
    }

    /* ข้อความ */

    .message{
        max-width:70%;
        padding:10px 14px;
        margin:10px 0;
        border-radius:18px;
        font-size:13px;
        line-height:1.4;
    }

    /* ฝั่งซ้าย */

    .left{
        background:#ececec;
        color:#333;
        float:left;
        clear:both;
        border-top-left-radius:4px;
    }

    /* ฝั่งขวา */

    .right{
        background:#0d6efd;
        color:white;
        float:right;
        clear:both;
        border-bottom-right-radius:4px;
    }

    /* ช่องส่งข้อความ */

    .chat-input{
        background:white;
        padding:10px;
        display:flex;
        gap:8px;
        border-radius:0 0 8px 8px;
    }

    .chat-input input{
        flex:1;
        padding:8px 12px;
        border:1px solid #ddd;
        border-radius:20px;
        outline:none;
    }

    .chat-input button{
        border:none;
        background:#0d6efd;
        color:white;
        padding:8px 18px;
        border-radius:18px;
        cursor:pointer;
        transition:.3s;
    }

    .chat-input button:hover{
        background:#005fe0;
    }
    </style>
</head>
<body>




<div class="chat-header">
    <h1>CHAT APP</h1>
        
</div>

<div class="chat-body">

    <div class="message left">
        Hi
    </div>

    <div class="message right">
        Hi
    </div>

    <div class="message left">
        r u gonna come to class today?
    </div>

    <div class="message right">
        yeah but maybe late like 5-10min
    </div> 

    <div class="message right">
        i will catch u up
    </div>

    <div class="message left">
        see you!
    </div>

    <div class="message right">
        see you!
    </div>


</div>

<div class="chat-input">
    <input type="text" placeholder="Type a message...">
    <button>Send</button>
</div>



</body>
</html>
