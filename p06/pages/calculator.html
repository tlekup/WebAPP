<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator UI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#e6e6e6;
}

.container{
    width:320px;
    margin:60px auto;
}

.calculator{
    background:#4cc9f0;
    border:2px solid #777;
    border-radius:15px;
    padding:20px;
}

.monitor{
    height:80px;
    background:white;
    border-radius:10px;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:15px;
    font-size:40px;
    margin-bottom:20px;
    overflow:hidden;
}

.buttons{
    display:flex;
    gap:15px;
}

/* ฝั่งซ้าย */
.left{
    flex:3;
}

.row{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
}

.row button{
    width:60px;
    height:60px;
}

/* ฝั่งขวา */
.right{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.right button{
    width:100%;
    height:60px;
}

/* ปุ่ม */
button{
    border:none;
    border-radius:10px;
    background:white;
    font-size:22px;
    cursor:pointer;
    box-shadow:0 2px 5px rgba(0,0,0,.2);
}

button:hover{
    background:#f2f2f2;
}

.equal{
    flex:1;
    background:#ffb703;
}
</style>

</head>

<body>

<div class="container">

    <div class="calculator">

        <!-- หน้าจอ -->
        <div class="monitor" id="monitor">0</div>

        <div class="buttons">

            <!-- ตัวเลข -->
            <div class="left">

                <div class="row">
                    <button onclick="pressNumber('7')">7</button>
                    <button onclick="pressNumber('8')">8</button>
                    <button onclick="pressNumber('9')">9</button>
                </div>

                <div class="row">
                    <button onclick="pressNumber('4')">4</button>
                    <button onclick="pressNumber('5')">5</button>
                    <button onclick="pressNumber('6')">6</button>
                </div>

                <div class="row">
                    <button onclick="pressNumber('1')">1</button>
                    <button onclick="pressNumber('2')">2</button>
                    <button onclick="pressNumber('3')">3</button>
                </div>

                <div class="row">
                    <button onclick="pressNumber('.')">.</button>
                    <button onclick="pressNumber('0')">0</button>
                    <button onclick="clearCalculator()">C</button>
                </div>

            </div>

            <!-- เครื่องหมาย -->
            <div class="right">
                <button onclick="pressOperator('+')">+</button>
                <button onclick="pressOperator('-')">-</button>
                <button onclick="pressOperator('*')">×</button>
                <button onclick="pressOperator('/')">÷</button>
                <button class="equal" onclick="calculate()">=</button>
            </div>

        </div>

    </div>

</div>


<script>

let currentNumber = "";
let previousNumber = "";
let operator = "";

const monitor = document.getElementById("monitor");


/* กดตัวเลข */
function pressNumber(number){

    // ป้องกันการใส่ . มากกว่า 1 ตัว
    if(number === "." && currentNumber.includes(".")){
        return;
    }

    // ถ้ากด . เป็นตัวแรก ให้เป็น 0.
    if(number === "." && currentNumber === ""){
        currentNumber = "0";
    }

    currentNumber += number;

    monitor.textContent = currentNumber;
}


/* กดเครื่องหมาย */
function pressOperator(op){

    // ถ้ายังไม่มีตัวเลข ไม่ต้องทำอะไร
    if(currentNumber === ""){
        return;
    }

    // ถ้ามีการคำนวณค้างอยู่ ให้คำนวณก่อน
    if(previousNumber !== ""){
        calculate();
    }

    previousNumber = currentNumber;
    currentNumber = "";
    operator = op;
}


/* คำนวณ */
function calculate(){

    if(previousNumber === "" || currentNumber === "" || operator === ""){
        return;
    }

    let num1 = Number(previousNumber);
    let num2 = Number(currentNumber);
    let result;


    switch(operator){

        case "+":
            result = num1 + num2;
            break;

        case "-":
            result = num1 - num2;
            break;

        case "*":
            result = num1 * num2;
            break;

        case "/":

            if(num2 === 0){
                monitor.textContent = "Error";

                currentNumber = "";
                previousNumber = "";
                operator = "";

                return;
            }

            result = num1 / num2;
            break;
    }


    currentNumber = String(result);

    previousNumber = "";
    operator = "";

    monitor.textContent = currentNumber;
}


/* ปุ่ม C */
function clearCalculator(){

    currentNumber = "";
    previousNumber = "";
    operator = "";

    monitor.textContent = "0";
}

</script>

</body>
</html>
