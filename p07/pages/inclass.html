<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
    </style>
</head>

<body>  
    <div>
        <div class="monitor" id="count">5</div>
        <button id="stop">click me</button>
    </div>

    <script>
        let countNumber = Number(document.getElementById("count").textContent);
        let textCount = document.getElementById("count");
        /*---countNumber = Number(textCount.textContent)--*/
        let btnStop = document.getElementById("stop");
        
        let mytime;
        let count = 0;
        let myinterval;

        btnStop.addEventListener("click", () => {
            count++;

            if (count % 2 === 1) {
                myinterval = setInterval(countDown, 1000)
            } else {
                StopBomb();
            }
            });

        function countDown(){
                if(countNumber>0){
                    countNumber--;
                    textCount.textContent = countNumber;
                    // mytime = setTimeout(countDown,1000)
                }else{
                    textCount.textContent = "you bombed";
                }

            }
        function StopBomb(){
                clearTimeout(myinterval);
                textCount.textContent = "you safed";
        }
    </script>
</body>
</html>
